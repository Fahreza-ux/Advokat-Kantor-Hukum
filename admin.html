<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="portal-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="logo.png" style="height:35px;"></div>
      <ul class="sidebar-menu">
        <li><a href="javascript:void(0)" class="active" onclick="bukaMenu('monitor', this)"><span class="emoji">📊</span> Data</a></li>
        <li><a href="javascript:void(0)" onclick="bukaMenu('buat', this)"><span class="emoji">➕</span> Buat Akun Klien</a></li>
        <li><a href="javascript:void(0)" onclick="bukaMenu('kelola', this)"><span class="emoji">👥</span> Akun Klien</a></li>
        <li class="mobile-logout"><a href="login-admin.html" onclick="logout()"><span class="emoji">🚪</span> Keluar</a></li>
      </ul>
      <button class="sidebar-logout" onclick="logout()">🚪 Logout Admin</button>
    </aside>

    <main class="portal-main">
      <!-- MONITOR -->
      <div id="tab-monitor" class="tab-panel">
        <div class="portal-topbar"><h1>Data & Dokumen Klien</h1></div>
        <div class="panel"><div class="panel-body"><table class="data-table"><thead><tr><th>Klien</th><th>No. Perkara</th><th>Status</th></tr></thead><tbody id="tblPrk"></tbody></table></div></div>
      </div>

      <!-- BUAT AKUN KLIEN -->
      <div id="tab-buat" class="tab-panel" hidden>
        <div class="portal-topbar"><h1>Buat Akun Klien Manual</h1></div>
        <div class="panel">
          <div class="panel-body">
            <div id="okBuat" class="alert-success" hidden>✓ Akun klien berhasil dibuat!</div>
            <form id="formBuat" class="portal-form">
              <div class="form-group"><label>Nama Klien</label><input type="text" id="bn" required></div>
              <div class="form-group"><label>Email</label><input type="email" id="be" required></div>
              <div class="form-group"><label>Password</label><input type="text" id="bp" required></div>
              <button type="submit" class="btn-primary">Buat Akun Klien</button>
            </form>
          </div>
        </div>
      </div>

      <!-- KELOLA KLIEN -->
      <div id="tab-kelola" class="tab-panel" hidden>
        <div class="portal-topbar"><h1>Akun Klien Aktif</h1></div>
        <div class="panel"><div class="panel-body"><table class="data-table"><thead><tr><th>Nama</th><th>Email</th><th>Pass</th></tr></thead><tbody id="tblAkun"></tbody></table></div></div>
      </div>
    </main>
  </div>

  <script>
    if (sessionStorage.getItem('authAdmin') !== 'true') {
      alert('Akses Ditolak.'); window.location.href = 'login-admin.html';
    }
    function logout() { sessionStorage.removeItem('authAdmin'); window.location.href = 'login-admin.html'; }
    function bukaMenu(id, el) {
      document.querySelectorAll('.tab-panel').forEach(p => p.hidden = true);
      document.getElementById('tab-' + id).hidden = false;
      document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    const getA = () => JSON.parse(localStorage.getItem('demoAkun') || '[]');
    const setA = (l) => localStorage.setItem('demoAkun', JSON.stringify(l));
    const getPr = () => JSON.parse(localStorage.getItem('demoPerkara') || '[]');

    function renderAll() {
      const perkara = getPr();
      document.getElementById('tblPrk').innerHTML = perkara.length ? perkara.map(p => `
        <tr><td>${p.owner}</td><td>${p.nomor}</td><td>${p.status}</td></tr>
      `).join('') : '<tr><td colspan="3" style="text-align:center;">Belum ada perkara.</td></tr>';

      const akun = getA();
      document.getElementById('tblAkun').innerHTML = akun.length ? akun.map(a => `
        <tr><td>${a.nama}</td><td>${a.email}</td><td>${a.password}</td></tr>
      `).join('') : '<tr><td colspan="3" style="text-align:center;">Belum ada akun klien.</td></tr>';
    }

    // PROSES SIMPAN AKUN BARU
    document.getElementById('formBuat').addEventListener('submit', (e) => {
      e.preventDefault();
      const a = getA();
      a.push({ 
        nama: document.getElementById('bn').value, 
        email: document.getElementById('be').value.toLowerCase().trim(), 
        password: document.getElementById('bp').value 
      });
      setA(a); 
      e.target.reset(); 
      document.getElementById('okBuat').hidden = false; 
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
