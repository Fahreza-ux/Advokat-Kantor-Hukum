<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Kelola Akun Klien</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>

  <div class="portal-layout">
    <aside class="sidebar">
      <a href="index.html" class="sidebar-brand">
        <span class="brand-mark">SH</span>
        <span>Admin Area</span>
      </a>
      <ul class="sidebar-menu">
        <li><a href="#" class="active" onclick="showTab('kelola', this)"><span class="emoji">👥</span> Akun Klien</a></li>
        <li><a href="#" onclick="showTab('pending', this)"><span class="emoji">⏳</span> Pendaftar <span id="pendingBadge" class="badge-count" hidden>0</span></a></li>
        <li><a href="#" onclick="showTab('buat', this)"><span class="emoji">➕</span> Buat Akun</a></li>
        <li class="mobile-logout">
          <a href="index.html" onclick="logoutAdmin()"><span class="emoji">🚪</span> Keluar</a>
        </li>
      </ul>
      <button class="sidebar-logout" onclick="logoutAdmin()">🚪 Logout Admin</button>
    </aside>

    <main class="portal-main">
      <!-- TAB KELOLA -->
      <div id="tab-kelola" class="tab-panel">
        <div class="portal-topbar">
          <div><h1>Akun Klien Aktif</h1><p>Klien yang bisa login ke portal.</p></div>
        </div>
        <div class="panel">
          <div class="panel-body">
            <table class="data-table">
              <thead><tr><th>Nama</th><th>Email</th><th>Pass</th><th>Aksi</th></tr></thead>
              <tbody id="akunTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- TAB PENDING -->
      <div id="tab-pending" class="tab-panel" hidden>
        <div class="portal-topbar">
          <div><h1>Pendaftar Baru</h1><p>Verifikasi pendaftar mandiri.</p></div>
        </div>
        <div class="panel">
          <div class="panel-body">
            <table class="data-table">
              <thead><tr><th>Nama</th><th>Email</th><th>Tanggal</th><th>Aksi</th></tr></thead>
              <tbody id="pendingTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- TAB BUAT -->
      <div id="tab-buat" class="tab-panel" hidden>
        <div class="portal-topbar">
          <div><h1>Buat Akun Baru</h1><p>Akun langsung aktif.</p></div>
        </div>
        <div class="panel">
          <div class="panel-body">
            <div id="alertBuat" class="alert-success" hidden>✓ Akun berhasil dibuat!</div>
            <form id="formBuat" class="portal-form">
              <div class="form-group"><label>Nama Klien</label><input type="text" id="buatNama" required></div>
              <div class="form-group"><label>Email</label><input type="text" id="buatEmail" required></div>
              <div class="form-group"><label>Password</label><input type="text" id="buatPass" required></div>
              <button type="submit" class="btn-primary">Buat Akun</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Login Admin
    const ADMIN_PASS = 'admin123';
    if (localStorage.getItem('adminLoggedIn') !== 'true') {
      if (prompt('Password Admin:') !== ADMIN_PASS) { window.location.href = 'index.html'; }
      else { localStorage.setItem('adminLoggedIn', 'true'); }
    }
    function logoutAdmin() { localStorage.removeItem('adminLoggedIn'); window.location.href = 'index.html'; }

    // Tab Switch
    function showTab(tab, el) {
      document.querySelectorAll('.tab-panel').forEach(p => p.hidden = true);
      document.getElementById('tab-' + tab).hidden = false;
      document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
      if(el) el.classList.add('active');
    }

    // Data Helper
    const getAkun = () => JSON.parse(localStorage.getItem('demoAkun') || '[]');
    const setAkun = (l) => localStorage.setItem('demoAkun', JSON.stringify(l));
    const getPending = () => JSON.parse(localStorage.getItem('demoPending') || '[]');
    const setPending = (l) => localStorage.setItem('demoPending', JSON.stringify(l));

    // Render Tables
    function renderAkun() {
      const list = getAkun();
      document.getElementById('akunTable').innerHTML = list.length ? list.map((a, i) => `
        <tr>
          <td><strong>${a.nama}</strong></td>
          <td>${a.email}</td>
          <td>${a.password}</td>
          <td><button onclick="hapusAkun(${i})" style="background:none;border:none;color:#dc2626;font-weight:bold;cursor:pointer;">Hapus</button></td>
        </tr>
      `).join('') : '<tr><td colspan="4" style="text-align:center;">Belum ada akun.</td></tr>';
    }

    function renderPending() {
      const list = getPending();
      const badge = document.getElementById('pendingBadge');
      if(list.length) { badge.hidden = false; badge.textContent = list.length; } else { badge.hidden = true; }

      document.getElementById('pendingTable').innerHTML = list.length ? list.map((p, i) => `
        <tr>
          <td><strong>${p.nama}</strong></td>
          <td>${p.email}</td>
          <td>${p.tanggal}</td>
          <td style="white-space:nowrap;">
            <button onclick="setuju(${i})" style="background:#dcfce7;color:#166534;border:none;padding:6px 10px;border-radius:10px;font-weight:bold;margin-right:4px;cursor:pointer;">Setujui</button>
            <button onclick="tolak(${i})" style="background:#fee2e2;color:#991b1b;border:none;padding:6px 10px;border-radius:10px;font-weight:bold;cursor:pointer;">Tolak</button>
          </td>
        </tr>
      `).join('') : '<tr><td colspan="4" style="text-align:center;">Tidak ada pendaftar.</td></tr>';
    }

    // Actions
    function hapusAkun(i) { if(confirm('Hapus akun ini?')) { const l = getAkun(); l.splice(i,1); setAkun(l); renderAkun(); } }
    function setuju(i) { const p = getPending(); const a = getAkun(); a.push(p[i]); setAkun(a); p.splice(i,1); setPending(p); renderAkun(); renderPending(); alert('Disetujui!'); showTab('kelola'); }
    function tolak(i) { const p = getPending(); p.splice(i,1); setPending(p); renderPending(); }

    // Form Buat Akun
    document.getElementById('formBuat').addEventListener('submit', (e) => {
      e.preventDefault();
      const a = getAkun();
      a.push({ nama: document.getElementById('buatNama').value, email: document.getElementById('buatEmail').value.toLowerCase(), password: document.getElementById('buatPass').value });
      setAkun(a); e.target.reset();
      document.getElementById('alertBuat').hidden = false; renderAkun();
    });

    // Init
    renderAkun(); renderPending();
  </script>
</body>
</html>
