<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Klien</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: var(--bg);">

  <!-- HEADER DAFTAR -->
  <header style="padding: 20px; text-align: center; border-bottom: 1px solid var(--line); background: var(--white);">
    <a href="index.html" class="brand" style="justify-content: center;">
      <span class="brand-mark">SH</span>
      <span class="brand-text">Setyo Hantoro <em>&</em> Associates</span>
    </a>
  </header>

  <!-- KARTU DAFTAR -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 40px; width: 100%; max-width: 420px; box-shadow: var(--shadow-md);">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Daftar Akun</h1>
        <p style="color: var(--ink-mute); font-size: 0.9rem;">Isi data diri Anda untuk diverifikasi Admin.</p>
      </div>

      <div id="successBox" style="display: none; background: #dcfce7; color: #166534; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; text-align: center;">Pendaftaran berhasil! Tunggu verifikasi admin.</div>

      <form id="daftarForm">
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">Nama Perusahaan / Klien</label>
          <input type="text" id="nama" required placeholder="PT Maju Jaya" style="width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 0.95rem; background: var(--bg);">
        </div>
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">Email</label>
          <input type="email" id="email" required placeholder="klien@perusahaan.com" style="width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 0.95rem; background: var(--bg);">
        </div>
        <div style="margin-bottom: 24px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">Password</label>
          <input type="password" id="pass" required minlength="6" placeholder="Min. 6 karakter" style="width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 0.95rem; background: var(--bg);">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; border-radius: 8px;">Daftar Sekarang</button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--ink-mute);">
        Sudah punya akun? <a href="login.html" style="color: var(--gold); font-weight: bold;">Login di sini</a>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('daftarForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.toLowerCase();
      const pending = JSON.parse(localStorage.getItem('demoPending') || '[]');
      
      if(pending.find(p => p.email === email)) { 
        alert('Email sudah terdaftar, tunggu verifikasi admin.'); 
        return; 
      }
      
      pending.push({
        nama: document.getElementById('nama').value,
        email: email,
        password: document.getElementById('pass').value,
        tanggal: new Date().toLocaleDateString('id-ID')
      });
      localStorage.setItem('demoPending', JSON.stringify(pending));
      e.target.reset();
      document.getElementById('successBox').style.display = 'block';
    });
  </script>
</body>
</html>
