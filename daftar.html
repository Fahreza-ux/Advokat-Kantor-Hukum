<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Klien</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-head">
      <h1>Daftar Akun</h1>
      <p>Isi data diri Anda untuk diverifikasi Admin.</p>
    </div>
    <div id="successBox" class="alert-success" hidden>Pendaftaran berhasil! Tunggu verifikasi admin.</div>
    <form id="daftarForm">
      <div class="form-group">
        <label>Nama Perusahaan / Klien</label>
        <input type="text" id="nama" required placeholder="PT Maju Jaya">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="klien@perusahaan.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="pass" required minlength="6" placeholder="Min. 6 karakter">
      </div>
      <button type="submit" class="btn-primary btn-block">Daftar Sekarang</button>
    </form>
    <div class="login-footer">
      Sudah punya akun? <a href="login.html" class="link-gold">Login</a>
    </div>
  </div>
  <script>
    document.getElementById('daftarForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.toLowerCase();
      const pending = JSON.parse(localStorage.getItem('demoPending') || '[]');
      
      if(pending.find(p => p.email === email)) { alert('Email sudah terdaftar, tunggu verifikasi.'); return; }
      
      pending.push({
        nama: document.getElementById('nama').value,
        email: email,
        password: document.getElementById('pass').value,
        tanggal: new Date().toLocaleDateString('id-ID')
      });
      localStorage.setItem('demoPending', JSON.stringify(pending));
      e.target.reset();
      document.getElementById('successBox').hidden = false;
    });
  </script>
</body>
</html>
