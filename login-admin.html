<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Internal — Setyo Hantoro & Associates</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: #081220;">

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 60px; height: 60px; background: var(--ink); color: var(--gold); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: bold; margin: 0 auto 16px;">SH</div>
        <h1 style="font-size: 1.6rem; margin-bottom: 8px;">Internal System</h1>
        <p style="color: var(--ink-mute); font-size: 0.85rem;">Akses khusus Admin Firma Hukum.</p>
      </div>
      
      <form id="loginAdminForm">
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">Email Admin</label>
          <input type="email" id="adminEmail" required style="width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 0.95rem; background: var(--bg);">
        </div>
        <div style="margin-bottom: 24px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">Password</label>
          <input type="password" id="adminPass" required style="width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 0.95rem; background: var(--bg);">
        </div>
        
        <div id="errorBox" style="display: none; background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; text-align: center;"></div>
        
        <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; border-radius: 8px; background: var(--ink);">Masuk ke Sistem</button>
      </form>
      
      <div style="text-align: center; margin-top: 24px; font-size: 0.8rem; color: var(--ink-mute);">
        <a href="index.html" style="color: var(--gold);">← Kembali ke Website Utama</a>
      </div>
    </div>
  </main>

  <script>
    // Kredensial Default Admin
    const defaultEmail = 'admin@setyohantoro.com';
    const defaultPass = 'admin123';

    document.getElementById('loginAdminForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.toLowerCase();
      const pass = document.getElementById('adminPass').value;
      const errorBox = document.getElementById('errorBox');

      // Ambil email & pass terbaru (jika admin sudah pernah ganti di panel)
      const currentEmail = localStorage.getItem('adminEmail') || defaultEmail;
      const currentPass = localStorage.getItem('adminPass') || defaultPass;

      if (email === currentEmail && pass === currentPass) {
        // Beri tiket login utama
        sessionStorage.setItem('authAdmin', 'true');
        
        // Pengecekan ulang (Double Verification)
        const verifikasi = prompt('🔒 KEAMANAN EKSTRA:\nKetik ulang password Anda untuk melanjutkan:');
        
        if (verifikasi === currentPass) {
          window.location.href = 'admin.html';
        } else {
          sessionStorage.removeItem('authAdmin');
          errorBox.textContent = 'Verifikasi ulang gagal.';
          errorBox.style.display = 'block';
        }
      } else {
        errorBox.textContent = 'Email atau password Admin salah.';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
