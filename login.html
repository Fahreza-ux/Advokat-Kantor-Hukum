<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Portal Klien</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-head">
      <h1>Portal Klien</h1>
      <p>Masuk untuk memantau perkembangan perkara.</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="nama@perusahaan.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div class="form-group" style="display:flex; gap:8px; align-items:center;">
        <input type="checkbox" id="remember" style="width:auto;">
        <label for="remember" style="margin:0; font-weight:400; font-size:0.85rem;">Ingat saya</label>
      </div>
      <div id="errorBox" class="alert-error" hidden></div>
      <button type="submit" class="btn-primary btn-block">Masuk</button>
    </form>
    <div class="login-footer">
      Belum punya akun? <a href="daftar.html" class="link-gold">Daftar di sini</a><br><br>
      <small>Demo: klien@demo.com / demo123</small>
    </div>
  </div>
  <script>
    if (localStorage.getItem('demoLoggedIn') === 'true' || sessionStorage.getItem('demoLoggedIn') === 'true') {
      window.location.href = 'portal.html';
    }
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.toLowerCase();
      const pass = document.getElementById('password').value;
      const rem = document.getElementById('remember').checked;
      
      const list = JSON.parse(localStorage.getItem('demoAkun') || '[]');
      list.push({ email: 'klien@demo.com', password: 'demo123', nama: 'Klien Demo' });
      
      const acc = list.find(a => a.email === email && a.password === pass);
      if (acc) {
        if(rem) localStorage.setItem('demoLoggedIn', 'true');
        else sessionStorage.setItem('demoLoggedIn', 'true');
        localStorage.setItem('demoEmailKlien', acc.email);
        localStorage.setItem('demoNamaKlien', acc.nama);
        window.location.href = 'portal.html';
      } else {
        const err = document.getElementById('errorBox');
        err.textContent = 'Email atau password salah.';
        err.hidden = false;
      }
    });
  </script>
</body>
</html>
