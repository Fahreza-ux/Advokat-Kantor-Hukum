<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Klien — SAKRI Law Firm</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: var(--bg);">
  
  <!-- HEADER LOGO -->
  <header style="padding: 16px 20px; text-align: center; border-bottom: 1px solid var(--line); background: var(--white);">
    <a href="index.html" class="brand" style="justify-content: center; display: flex; align-items: center; gap: 10px; text-decoration: none;">
      <img src="logo.png" style="height: 45px !important; max-height: 45px;">
      <span class="brand-text" style="font-size: 1rem; font-weight: bold; color: var(--ink);">Setyo Hantoro <em>&</em> Associates</span>
    </a>
  </header>

  <!-- KOTAK LOGIN -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Portal Klien</h1>
        <p style="color: var(--ink-mute); font-size: 0.9rem;">Masuk untuk memantau perkembangan perkara Anda.</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="nama@perusahaan.com" required>
        </div>
        
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="margin: 0;">Password</label>
            <a href="#" style="font-size: 0.75rem; color: var(--gold); font-weight: 600; text-decoration: none;">Lupa Sandi?</a>
          </div>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <!-- PESAN ERROR -->
        <div id="errorBox" style="display: none; background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; text-align: center;"></div>
        
        <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; border-radius: 8px; margin-top: 10px;">Masuk</button>
      </form>

      <!-- MENU DAFTAR (DITAMBAHKAN KEMBALI) -->
      <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--ink-mute);">
        Belum punya akun? <a href="daftar.html" style="color: var(--gold); font-weight: bold; text-decoration: none;">Daftar di sini</a>
      </div>
      
      <!-- INFO AKUN DEMO -->
      <div style="margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--line); text-align: center;">
        <p style="font-size: 0.75rem; color: #9ca3af;">Demo Klien: <strong>klien@demo.com</strong> / <strong>demo123</strong></p>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.toLowerCase().trim();
      const pass = document.getElementById('password').value.trim();
      const errorBox = document.getElementById('errorBox');

      let semuaDataKlien = JSON.parse(localStorage.getItem('demoAkun') || '[]');
      semuaDataKlien.push({ email: 'klien@demo.com', password: 'demo123', nama: 'Klien Demo' });

      const akunDitemukan = semuaDataKlien.find(a => a.email === email && a.password === pass);
      
      if (akunDitemukan) {
        sessionStorage.setItem('demoLoggedIn', 'true');
        localStorage.setItem('demoEmailKlien', akunDitemukan.email);
        localStorage.setItem('demoNamaKlien', akunDitemukan.nama);
        window.location.href = 'portal.html';
      } else {
        errorBox.textContent = 'Email atau password klien salah.';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
