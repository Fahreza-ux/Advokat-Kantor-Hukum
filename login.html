<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Klien — SAKRI & Associates</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: #0a0a0a;">
  
  <header style="padding: 16px 20px; text-align: center; border-bottom: 1px solid #27272a; background: #0a0a0a;">
    <a href="index.html" class="brand" style="justify-content: center; display: flex; align-items: center; gap: 10px; text-decoration: none;">
      <img src="logo.png" style="height: 45px !important;">
      <span style="font-size: 1rem; font-weight: bold; color: #ffffff;">SAKRI <em style="color: #d4af37; font-style: normal;">&</em> Associates</span>
    </a>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #18181b; border: 1px solid #27272a; border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.8rem; margin-bottom: 8px; color: #d4af37;">Portal Klien</h1>
        <p style="color: #a1a1aa; font-size: 0.9rem;">Masuk untuk memantau perkembangan perkara.</p>
      </div>
      
      <form id="loginForm">
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #a1a1aa;">Email</label>
          <!-- WARNA INPUT DIPAKSA PUTIH -->
          <input type="email" id="email" required style="width: 100%; padding: 12px; border: 1.5px solid #27272a; border-radius: 8px; font-size: 0.95rem; background: #0a0a0a; color: #ffffff;">
        </div>
        <div style="margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="margin: 0; color: #a1a1aa;">Password</label>
            <a href="#" style="font-size: 0.75rem; color: #d4af37; font-weight: 600; text-decoration: none;">Lupa Sandi?</a>
          </div>
          <input type="password" id="password" required style="width: 100%; padding: 12px; border: 1.5px solid #27272a; border-radius: 8px; font-size: 0.95rem; background: #0a0a0a; color: #ffffff;">
        </div>
        <div id="errorBox" style="display: none; background: #7f1d1d; color: #fca5a5; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; text-align: center;"></div>
        <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; border-radius: 8px; background: #d4af37; color: #0a0a0a; font-weight: bold;">Masuk</button>
      </form>
      <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: #a1a1aa;">
        Belum punya akun? <a href="daftar.html" style="color: #d4af37; font-weight: bold; text-decoration: none;">Daftar di sini</a>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.toLowerCase().trim();
      const pass = document.getElementById('password').value.trim();
      const errorBox = document.getElementById('errorBox');

      let semuaDataKlien = JSON.parse(localStorage.getItem('demoAkun') || '[]');
      semuaDataKlien.push({ email: 'klien@demo.com', password: 'demo123', nama: 'Klien Demo' });

      const akunDitemukan = semuaDataKlien.find(a => a.email === email && a.password === pass);
      
      if (akunDitemukan) {
        sessionStorage.setItem('demoLoggedIn', 'true');
        localStorage.setItem('demoEmailKlien', akunDitemukan.email);
        localStorage.setItem('demoNamaKlien', akunDitemukan.nama);
        window.location.href = 'portal.html';
      } else {
        errorBox.textContent = 'Email atau password klien salah.';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
