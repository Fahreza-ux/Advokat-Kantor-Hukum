<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perkara — Klien</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="portal-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark">SH</span><span>Setyo Hantoro</span></div>
      <ul class="sidebar-menu">
        <li><a href="portal.html"><span class="emoji">🏠</span> Dashboard</a></li>
        <li><a href="portal-perkara.html" class="active"><span class="emoji">📋</span> Perkara</a></li>
        <li><a href="portal-upload.html"><span class="emoji">📄</span> Upload</a></li>
        <li class="mobile-logout"><a href="login.html" onclick="logout()"><span class="emoji">🚪</span> Keluar</a></li>
      </ul>
      <button class="sidebar-logout" onclick="logout()">🚪 Logout</button>
    </aside>
    <main class="portal-main">
      <div class="portal-topbar"><h1>Perkara Saya</h1><p>Daftar perkara Anda.</p></div>
      <div class="panel">
        <div class="panel-head"><h3>Tambah Perkara</h3></div>
        <div class="panel-body">
          <form id="form" class="portal-form">
            <div class="form-group"><label>Nomor Perkara</label><input type="text" id="nomor" required></div>
            <div class="form-group">
              <label>Jenis</label>
              <select id="jenis" required><option value="Sengketa Bisnis">Sengketa Bisnis</option><option value="Mediasi">Mediasi</option></select>
            </div>
            <button type="submit" class="btn-primary">Simpan</button>
          </form>
        </div>
      </div>
      <div class="panel">
        <div class="panel-body">
          <table class="data-table">
            <thead><tr><th>No</th><th>Jenis</th><th>Aksi</th></tr></thead>
            <tbody id="tbl"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script>
    if (localStorage.getItem('demoLoggedIn') !== 'true' && sessionStorage.getItem('demoLoggedIn') !== 'true') window.location.href = 'login.html';
    function logout() { localStorage.removeItem('demoLoggedIn'); sessionStorage.removeItem('demoLoggedIn'); window.location.href = 'login.html'; }
    
    const user = localStorage.getItem('demoEmailKlien') || 'demo';
    function render() {
      const d = JSON.parse(localStorage.getItem('demoPerkara') || '[]').filter(p => p.owner === user);
      document.getElementById('tbl').innerHTML = d.length ? d.map(p => `
        <tr><td><strong>${p.nomor}</strong></td><td>${p.jenis}</td><td><button onclick="hapus('${p.id}')" style="color:red;border:none;background:none;cursor:pointer;">Hapus</button></td></tr>
      `).join('') : '<tr><td colspan="3" style="text-align:center;">Kosong</td></tr>';
    }
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const d = JSON.parse(localStorage.getItem('demoPerkara') || '[]');
      d.unshift({ id: Date.now().toString(), owner: user, nomor: document.getElementById('nomor').value, jenis: document.getElementById('jenis').value, status: 'pending' });
      localStorage.setItem('demoPerkara', JSON.stringify(d));
      e.target.reset(); render();
    });
    function hapus(id) {
      if(!confirm('Hapus?')) return;
      let d = JSON.parse(localStorage.getItem('demoPerkara') || '[]').filter(p => p.id !== id);
      localStorage.setItem('demoPerkara', JSON.stringify(d)); render();
    }
    render();
  </script>
</body>
</html>
