<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perkara Saya — Portal Klien</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>

  <div class="portal-layout">
    <aside class="sidebar">
      <a href="index.html" class="sidebar-brand">
        <span class="brand-mark">SH</span>
        <span>Setyo Hantoro</span>
      </a>
      <ul class="sidebar-menu">
        <li><a href="portal.html"><span class="emoji">🏠</span> Dashboard</a></li>
        <li><a href="portal-perkara.html" class="active"><span class="emoji">📋</span> Perkara</a></li>
        <li><a href="portal-upload.html"><span class="emoji">📄</span> Upload</a></li>
        <li class="mobile-logout">
          <a href="login.html" onclick="logout()"><span class="emoji">🚪</span> Keluar</a>
        </li>
      </ul>
      <button class="sidebar-logout" onclick="logout()">🚪 Logout</button>
    </aside>

    <main class="portal-main">
      <div class="portal-topbar">
        <div><h1>Perkara Saya</h1><p>Daftar perkara yang ditangani.</p></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Tambah Perkara</h3></div>
        <div class="panel-body">
          <form id="perkaraForm" class="portal-form">
            <div class="form-group">
              <label>Nomor Perkara</label>
              <input type="text" id="nomor" placeholder="mis. 045/Pdt.G/2026/PN.Tng" required>
            </div>
            <div class="form-group">
              <label>Jenis</label>
              <select id="jenis" required>
                <option value="">-- Pilih --</option>
                <option>Sengketa Bisnis</option>
                <option>Mediasi</option>
                <option>Arbitrase</option>
              </select>
            </div>
            <button type="submit" class="btn-primary">Simpan</button>
          </form>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Daftar Perkara</h3></div>
        <div class="panel-body">
          <table class="data-table">
            <thead><tr><th>No. Perkara</th><th>Jenis</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody id="perkaraTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    if (localStorage.getItem('demoLoggedIn') !== 'true') window.location.href = 'login.html';
    function logout() { localStorage.removeItem('demoLoggedIn'); window.location.href = 'login.html'; }

    const table = document.getElementById('perkaraTable');

    function renderPerkara() {
      const list = JSON.parse(localStorage.getItem('demoPerkara') || '[]');
      if (list.length === 0) {
        table.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada perkara.</td></tr>';
        return;
      }
      table.innerHTML = list.map((p, i) => `
        <tr>
          <td><strong>${p.nomor}</strong></td>
          <td>${p.jenis}</td>
          <td><span class="status-pill ${p.status}">${p.status}</span></td>
          <td><button onclick="hapusPerkara(${i})" style="background:none;border:none;color:#dc2626;font-weight:bold;cursor:pointer;">Hapus</button></td>
        </tr>
      `).join('');
    }

    document.getElementById('perkaraForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const list = JSON.parse(localStorage.getItem('demoPerkara') || '[]');
      list.unshift({ 
        nomor: document.getElementById('nomor').value, 
        jenis: document.getElementById('jenis').value, 
        status: 'pending' 
      });
      localStorage.setItem('demoPerkara', JSON.stringify(list));
      e.target.reset();
      renderPerkara();
    });

    function hapusPerkara(i) {
      const list = JSON.parse(localStorage.getItem('demoPerkara') || '[]');
      list.splice(i, 1);
      localStorage.setItem('demoPerkara', JSON.stringify(list));
      renderPerkara();
    }

    renderPerkara();
  </script>
</body>
</html>
