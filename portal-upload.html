<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload — Klien</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="portal-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark">SH</span><span>Setyo Hantoro</span></div>
      <ul class="sidebar-menu">
        <li><a href="portal.html"><span class="emoji">🏠</span> Dashboard</a></li>
        <li><a href="portal-perkara.html"><span class="emoji">📋</span> Perkara</a></li>
        <li><a href="portal-upload.html" class="active"><span class="emoji">📄</span> Upload</a></li>
        <li class="mobile-logout"><a href="login.html" onclick="logout()"><span class="emoji">🚪</span> Keluar</a></li>
      </ul>
      <button class="sidebar-logout" onclick="logout()">🚪 Logout</button>
    </aside>
    <main class="portal-main">
      <div class="portal-topbar"><h1>Upload Dokumen</h1><p>Unggah dokumen atau bukti transfer.</p></div>
      <div class="panel">
        <div class="panel-body">
          <div id="ok" class="alert-success" hidden>✓ Berhasil diunggah (Demo).</div>
          <form id="form" class="portal-form">
            <div class="form-group">
              <label>Kategori</label>
              <select id="kat" required>
                <option value="KTP">KTP</option>
                <option value="Kontrak">Kontrak</option>
                <option value="Bukti Pembayaran">Bukti Pembayaran / Transfer</option>
              </select>
            </div>
            <div class="form-group">
              <div class="dropzone" onclick="document.getElementById('file').click()">
                <p id="dropTxt">Klik untuk pilih file</p>
              </div>
              <input type="file" id="file" hidden required>
            </div>
            <button type="submit" class="btn-primary">Upload</button>
          </form>
        </div>
      </div>
      <div class="panel">
        <div class="panel-body">
          <table class="data-table">
            <thead><tr><th>File</th><th>Kategori</th><th>Aksi</th></tr></thead>
            <tbody id="tbl"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script>
    if (localStorage.getItem('demoLoggedIn') !== 'true' && sessionStorage.getItem('demoLoggedIn') !== 'true') window.location.href = 'login.html';
    function logout() { localStorage.removeItem('demoLoggedIn'); sessionStorage.removeItem('demoLoggedIn'); window.location.href = 'login.html'; }
    
    const user = localStorage.getItem('demoEmailKlien') || 'demo';
    document.getElementById('file').addEventListener('change', function() {
      if(this.files.length > 0) document.getElementById('dropTxt').textContent = '✓ ' + this.files[0].name;
    });

    function render() {
      const d = JSON.parse(localStorage.getItem('demoDokumen') || '[]').filter(p => p.owner === user);
      document.getElementById('tbl').innerHTML = d.length ? d.map(p => `
        <tr><td>${p.nama}</td><td><span class="status-pill ${p.kategori==='Bukti Pembayaran'?'aktif':'pending'}">${p.kategori}</span></td><td><button onclick="hapus('${p.id}')" style="color:red;border:none;background:none;cursor:pointer;">Hapus</button></td></tr>
      `).join('') : '<tr><td colspan="3" style="text-align:center;">Belum ada file.</td></tr>';
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = document.getElementById('file').files[0];
      if(!f) return;
      const d = JSON.parse(localStorage.getItem('demoDokumen') || '[]');
      d.unshift({ id: Date.now().toString(), owner: user, nama: f.name, kategori: document.getElementById('kat').value, tanggal: new Date().toLocaleDateString('id-ID') });
      localStorage.setItem('demoDokumen', JSON.stringify(d));
      document.getElementById('ok').hidden = false;
      e.target.reset(); document.getElementById('dropTxt').textContent = 'Klik untuk pilih file';
      render();
    });

    function hapus(id) {
      if(!confirm('Hapus?')) return;
      let d = JSON.parse(localStorage.getItem('demoDokumen') || '[]').filter(p => p.id !== id);
      localStorage.setItem('demoDokumen', JSON.stringify(d)); render();
    }
    render();
  </script>
</body>
</html>
