<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Portal Klien</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>

  <div class="portal-layout">
    
    <!-- KONTEN UTAMA (Ditaruh paling atas agar muncul di HP) -->
    <main class="portal-main">
      <div class="portal-topbar">
        <div>
          <h1>Selamat datang, <span id="namaKlien">Klien</span></h1>
          <p id="emailKlien">klien@demo.com</p>
        </div>
      </div>

      <div class="portal-stats">
        <div class="stat-card"><div class="num" id="statDokumen">0</div><div class="lbl">Dokumen Diunggah</div></div>
        <div class="stat-card"><div class="num" id="statPerkara">0</div><div class="lbl">Perkara Aktif</div></div>
        <div class="stat-card"><div class="num">1</div><div class="lbl">Sidang Mendatang</div></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Perkara Terbaru</h3><a href="portal-perkara.html" style="color:var(--gold);font-size:0.85rem;font-weight:bold;">Lihat semua →</a></div>
        <div class="panel-body">
          <table class="data-table">
            <thead><tr><th>No. Perkara</th><th>Jenis</th><th>Status</th></tr></thead>
            <tbody id="perkaraPreview"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- SIDEBAR / MENU (Ditaruh di bawah konten) -->
    <aside class="sidebar">
      <a href="index.html" class="sidebar-brand">
        <span class="brand-mark">SH</span>
        <span>Setyo Hantoro</span>
      </a>
      <ul class="sidebar-menu">
        <li><a href="portal.html" class="active"><span class="emoji">🏠</span> Dashboard</a></li>
        <li><a href="portal-perkara.html"><span class="emoji">📋</span> Perkara</a></li>
        <li><a href="portal-upload.html"><span class="emoji">📄</span> Upload</a></li>
        <li class="mobile-logout">
          <a href="login.html" onclick="logout()"><span class="emoji">🚪</span> Keluar</a>
        </li>
      </ul>
      <button class="sidebar-logout" onclick="logout()">🚪 Logout</button>
    </aside>

  </div>

  <script>
    if (localStorage.getItem('demoLoggedIn') !== 'true') window.location.href = 'login.html';
    function logout() { localStorage.removeItem('demoLoggedIn'); window.location.href = 'login.html'; }

    document.getElementById('namaKlien').textContent = localStorage.getItem('demoNamaKlien') || 'Klien';
    document.getElementById('emailKlien').textContent = localStorage.getItem('demoEmailKlien') || '';

    const userEmail = localStorage.getItem('demoEmailKlien') || 'demo';

    const allDok = JSON.parse(localStorage.getItem('demoDokumen') || '[]');
    const myDok = allDok.filter(d => d.owner === userEmail);
    document.getElementById('statDokumen').textContent = myDok.length;

    const allPrk = JSON.parse(localStorage.getItem('demoPerkara') || '[]');
    const myPrk = allPrk.filter(p => p.owner === userEmail);
    document.getElementById('statPerkara').textContent = myPrk.length;

    const prev = document.getElementById('perkaraPreview');
    if(myPrk.length > 0) {
      prev.innerHTML = myPrk.slice(0, 3).map(p => `
        <tr><td><strong>${p.nomor}</strong></td><td>${p.jenis}</td><td><span class="status-pill ${p.status}">${p.status}</span></td></tr>
      `).join('');
    } else {
      prev.innerHTML = '<tr><td colspan="3" style="text-align:center;">Belum ada perkara.</td></tr>';
    }
  </script>
</body>
</html>
