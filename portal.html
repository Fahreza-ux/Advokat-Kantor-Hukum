<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Klien</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="portal-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark">SH</span><span>Setyo Hantoro</span></div>
      <ul class="sidebar-menu">
        <li><a href="portal.html" class="active"><span class="emoji">🏠</span> Dashboard</a></li>
        <li><a href="portal-perkara.html"><span class="emoji">📋</span> Perkara</a></li>
        <li><a href="portal-upload.html"><span class="emoji">📄</span> Upload</a></li>
        <li class="mobile-logout"><a href="login.html" onclick="logout()"><span class="emoji">🚪</span> Keluar</a></li>
      </ul>
      <button class="sidebar-logout" onclick="logout()">🚪 Logout</button>
    </aside>
    <main class="portal-main">
      <div class="portal-topbar">
        <h1>Halo, <span id="nm">Klien</span></h1>
        <p id="em">email@klien.com</p>
      </div>
      <div class="portal-stats">
        <div class="stat-card"><div class="num" id="stDok">0</div><div class="lbl">Dokumen Saya</div></div>
        <div class="stat-card"><div class="num" id="stPrk">0</div><div class="lbl">Perkara Saya</div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Perkara Terbaru</h3></div>
        <div class="panel-body">
          <table class="data-table">
            <thead><tr><th>No. Perkara</th><th>Jenis</th><th>Status</th></tr></thead>
            <tbody id="tblPrk"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script>
    if (localStorage.getItem('demoLoggedIn') !== 'true' && sessionStorage.getItem('demoLoggedIn') !== 'true') window.location.href = 'login.html';
    function logout() { localStorage.removeItem('demoLoggedIn'); sessionStorage.removeItem('demoLoggedIn'); window.location.href = 'login.html'; }
    
    const em = localStorage.getItem('demoEmailKlien') || 'demo';
    document.getElementById('nm').textContent = localStorage.getItem('demoNamaKlien') || 'Klien';
    document.getElementById('em').textContent = em;
    
    const allDok = JSON.parse(localStorage.getItem('demoDokumen') || '[]').filter(d => d.owner === em);
    const allPrk = JSON.parse(localStorage.getItem('demoPerkara') || '[]').filter(p => p.owner === em);
    
    document.getElementById('stDok').textContent = allDok.length;
    document.getElementById('stPrk').textContent = allPrk.length;
    
    document.getElementById('tblPrk').innerHTML = allPrk.length ? allPrk.slice(0,3).map(p => `
      <tr><td><strong>${p.nomor}</strong></td><td>${p.jenis}</td><td><span class="status-pill ${p.status === 'Berjalan' ? 'aktif' : 'pending'}">${p.status}</span></td></tr>
    `).join('') : '<tr><td colspan="3" style="text-align:center;">Belum ada perkara.</td></tr>';
  </script>
</body>
</html>
